name: Build MAME3D (VS2022)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dev/mame3d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate VS2022 Solution & Compile
        shell: cmd
        run: |
          mingw32-make -j4 vs2022 NOWERROR=1
          msbuild build\projects\windows\mame\vs2022\mame.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: mame3d-win64
          path: dev/mame3d/mame.exe
