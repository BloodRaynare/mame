name: Build MAME3D (VS2022)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Export processor count to GITHUB_ENV
        run: echo "CPU_COUNT=$env:NUMBER_OF_PROCESSORS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      
      - name: Checkout dev/mame3d branch
        uses: actions/checkout@v4
        with:
          ref: dev/mame3d

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate VS2022 Solution & Compile
        shell: cmd
        run: |
          mingw32-make -j${{ env.CPU_COUNT }} TARGET=mame3d vs2022 MODERN_WIN_API=1 NOWERROR=1
          msbuild build\projects\windows\mame\vs2022\mame.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: mame3d-win64
          path: mame*.exe
